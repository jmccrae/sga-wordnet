# Configuration for the EWE Wordnet Editor (https://github.com/jmccrae/ewe).
#
# Every path below is resolved relative to this file's own directory, not the
# process's working directory - so this repo can be opened from anywhere
# (including via the desktop app's "Open Wordnet Folder" picker) and the
# paths keep working.
database = "wordnet.db"
wordnet_source = "src/yaml"
corpus_source = "data/sga_incomplete.teanga.yaml"
logo = "branding/four-provinces-flag.svg"
id_prefix = "sga"
project_name = "Old Irish Wordnet"
tagline = "A wordnet for Old Irish (sga), extended from the Open English Wordnet"
contact_email = "johnmccrae@gmail.com"
source_url = "https://github.com/jmccrae/sga-wordnet"

# EWE no longer supports a per-project theme.css (see jmccrae/ewe#45) - restyling is now this
# [theme] table of CSS custom-property overrides on top of the app's own bundled defaults.
# primary/accent are the Four Provinces Flag's dark green (Leinster's field) and gold (Ulster's
# field and the charges throughout); font_heading picks Uncial Antiqua - the hand used to write
# Old Irish in manuscripts like the Book of Kells - over the bundled default heading font, and
# font_heading_weight avoids synthetic bold on its single (400) weight. Requires
# jmccrae/ewe#53 (bundling Uncial Antiqua as a selectable font_heading) to be merged, or
# font_heading here silently falls back to the generic `serif` keyword instead.
[theme]
primary = "#003d07"
accent = "#806600"
font_heading = "Uncial Antiqua, serif"
font_heading_weight = "400"
